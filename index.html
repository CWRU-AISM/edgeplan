* { box-sizing: border-box; }

.btn:hover:not(:disabled) { background: var(--shade); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.btn.danger { color: var(--critical); border-color: var(--critical); }

button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--warn); font-size: 14px; }
.banner[hidden] { display: none; }
.banner p { flex: 1 1 320px; }
.flash { font-size: 13px; color: var(--ink-2); }

.constraint { border-left: 4px solid var(--critical); background: var(--surface); padding: 12px 16px; border-radius: 0 6px 6px 0; max-width: 86ch; }
.constraint[hidden] { display: none; }

/* gantt */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; display: inline-block; }
.lg-hatch { width: 22px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(135deg, var(--ink-2) 0 3px, transparent 3px 7px); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.lg-ms { width: 10px; height: 10px; transform: rotate(45deg); background: var(--ink-2); border-radius: 1px; }
.lg-gate { width: 10px; height: 10px; transform: rotate(45deg); box-shadow: inset 0 0 0 2px var(--ink-2); border-radius: 1px; }
.lg-break { width: 22px; height: 10px; background: repeating-linear-gradient(135deg, var(--ink-3) 0 2px, transparent 2px 6px); border-radius: 2px; }
.gantt-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.gantt { display: grid; position: relative; font-size: 13px; grid-auto-rows: minmax(30px, auto); }
.g-corner { position: sticky; left: 0; z-index: 6; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--ink-3); display: flex; align-items: end; }
.g-week { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 8px 6px 2px; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }
.g-day { text-align: center; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); padding: 2px 0 6px; line-height: 1.25; z-index: 1; border-bottom: 1px solid var(--line); }
.g-day b { display: block; font-weight: 500; color: var(--ink-2); font-size: 12px; }
.g-day.today b { color: var(--surface); background: var(--ink); border-radius: 3px; margin: 0 3px; }
.g-track { grid-column: 1 / -1; z-index: 4; padding-top: 10px; pointer-events: none; }
.g-track-in { pointer-events: auto; }
.g-track-in { position: sticky; left: 0; display: inline-flex; align-items: center; gap: 8px; padding: 2px 12px; font-weight: 600; font-size: 13.5px; background: var(--surface); border-radius: 0 6px 6px 0; }
.g-track-in .who { font-weight: 400; color: var(--ink-2); }
.mini { font: inherit; font-size: 12px; padding: 1px 8px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.mini:hover { color: var(--ink); background: var(--shade); }
.g-label { position: sticky; left: 0; z-index: 5; background: var(--surface); border: 0; border-right: 1px solid var(--line); font: inherit; font-size: 13px; color: var(--ink);
  display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; text-align: left; cursor: pointer; min-width: 0; }
.g-label .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.g-shade { background: var(--shade); z-index: 0; }

.g-break-label { z-index: 2; align-self: start; justify-self: center; font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--surface); padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

      h += '<div class="g-track" style="grid-row:' + row + '"><div class="g-track-in"><i class="swatch" style="background:' + colorVar(tr.color) + '"></i>' +
        "<span>" + esc(tr.name) + '</span><span class="who">· ' + esc(tr.who) + "</span>" +
        (ed ? '<button class="mini" type="button" data-act="add-task" data-track="' + esc(tr.id) + '">+ Task</button><button class="mini" type="button" data-act="edit-track" data-track="' + esc(tr.id) + '">Edit track</button>' : "") +

        var st = STATUSES[t.status] ? t.status : "todo";
        h += '<button type="button" class="g-label' + dim + '" style="grid-row:' + row + ';grid-column:1" data-act="edit-task" data-id="' + esc(t.id) + '" title="' + esc(t.name + (t.owner ? " · " + t.owner : "")) + '">' +
          '<span class="si ' + st + '" aria-label="' + esc(STATUSES[st]) + '" title="' + esc(STATUSES[st]) + '">' + STATUS_ICON[st] + '</span><span class="nm">' + esc(t.name) + '</span><span class="own">' + esc(t.owner) + "</span></button>";
        var aria = esc(t.name + ", " + datesText(t) + (t.owner ? ", owner " + t.owner : "") + ", " + STATUSES[st]);
        if (isPoint(t)) {
          h += '<div class="ms-slot' + dim + '" style="grid-row:' + row + ";grid-column:" + (a + 2) + '"><div class="ms' + (t.kind === "gate" ? " gate" : "") + " st-" + st + '" tabindex="0" role="button" data-id="' + esc(t.id) + '" aria-label="' + aria + '" style="--c:' + colorVar(tr.color) + '"></div></div>';
        } else {

  function showTip(el, html) {

  /* drag */
  var drag = null;
  function onPointerDown(e) {
    var el = e.target.closest(".bar, .ms");

    var t = taskById(el.dataset.id);
    if (!t) return;
    var hd = e.target.closest(".h");
    drag = { id: t.id, el: el, slot: el.parentElement, x0: e.clientX, s0: t.start, e0: taskEnd(t), s: t.start, e: taskEnd(t),

  function onPointerMove(e) {

    drag.el.classList.add("dragging");
    var days = Math.round((e.clientX - drag.x0) / DAY_W);
    var r = drag.r, s = drag.s0, en = drag.e0;
    var t = taskById(drag.id);
    if (drag.how === "move" || isPoint(t)) {
      days = Math.max(days, diffDays(drag.s0, r.s)); days = Math.min(days, diffDays(drag.e0, r.e));
      s = addDays(drag.s0, days); en = addDays(drag.e0, days);

    } else {

  function headHtml(title) {

  /* ---------- save to GitHub ---------- */
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

    var b = html.indexOf("</" + "script>", a);
    try { var r = JSON.parse(html.slice(a, b)).rev; return typeof r === "number" ? r : null; } catch (e) { return null; }
  }

  function openTokenDialog(then) {

      '<p class="lede">Saving commits this page to ' + esc(GH.owner + "/" + GH.repo) + ' under your GitHub account. You need write access to that repository and a token. The token stays in this browser only.</p>' +

      '<li>Resource owner: <b>' + esc(GH.owner) + '</b>. Repository access: Only select repositories → <b>' + esc(GH.repo) + '</b>.</li>' +

  function saveGitHub() {

    writeDraft();
    var fail = function (code, detail) { var e = new Error(code); e.code = code; e.detail = detail; return e; };

      if (res.status === 401) throw fail("auth");

      else if (code === "access") flash("This GitHub account can't write to " + GH.owner + "/" + GH.repo + ". Ask an admin for write access, or check the token's repository and Contents permission.");
      else if (code === "conflict") flash("Someone saved a newer version first. Reload the page in a minute to get it; your edits are kept and you can restore them.");
      else if (code === "http") flash("GitHub returned an error (" + err.detail + "). Your edits are kept in this browser; try again in a moment.");

  function checkLastSave() {

  /* ---------- export xlsx ---------- */

  function buildWorkbook(X) {

    var WRAP = { alignment: { vertical: "top", wrapText: true } };

    var hexOf = function (tr) { return (COLORS[tr && tr.color] || COLORS.grey)[1]; };

    /* Schedule */

      put(ws, r, 5, { t: "n", v: excelSerial(t.start), z: "ddd mmm d, yyyy", s: { alignment: { vertical: "top" } } });
      put(ws, r, 6, { t: "n", v: excelSerial(taskEnd(t)), z: "ddd mmm d, yyyy", s: { alignment: { vertical: "top" } } });
      put(ws, r, 7, { t: "n", v: diffDays(t.start, taskEnd(t)) + 1, f: "G" + R + "-F" + R + "+1", s: { alignment: { vertical: "top", horizontal: "center" } } });

    X.utils.book_append_sheet(wb, tl, "Timeline");

    /* Tables */
    var sheetNames = { decisions: "Decisions", handoffs: "Handoffs", risks: "Risks" };
    TABLES.forEach(function (cfg) {
      var s2 = {}, rows = state[cfg.key] || [];
      cfg.cols.forEach(function (c, ci) { put(s2, 0, ci, { t: "s", v: c.label, s: HEAD }); });
      rows.forEach(function (rw, ri) {
        cfg.cols.forEach(function (c, ci) {
          var v = rw[c.k] == null ? "" : String(rw[c.k]);
          if (c.type === "date" && isISO(v)) put(s2, ri + 1, ci, { t: "n", v: excelSerial(v), z: "ddd mmm d, yyyy", s: WRAP });
          else put(s2, ri + 1, ci, { t: "s", v: c.type === "select" ? (c.options[v] || v) : v, s: WRAP });
        });
      });
      s2["!ref"] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(1, rows.length), c: cfg.cols.length - 1 } });
      s2["!cols"] = cfg.cols.map(function (c) { return { wch: c.type === "date" ? 18 : c.k === "id" ? 6 : /rec|plan|what|detail/.test(c.k) ? 70 : 24 }; });
      X.utils.book_append_sheet(wb, s2, sheetNames[cfg.key] || cfg.key);
    });

    /* About */
    var ab = {}, info = [["Plan", state.title || ""], ["Goal", state.goal || ""], ["Note", state.constraint || ""], ["Timeline starts", null, state.start], ["Deadline", null, state.end],
      ["Saved version", String(saved.rev || 1) + (dirty ? " plus unsaved edits" : "")], ["Exported", new Date().toLocaleString()]];
    info.forEach(function (it, r) {
      put(ab, r, 0, { t: "s", v: it[0], s: { font: { bold: true }, alignment: { vertical: "top" } } });
      put(ab, r, 1, it[2] ? { t: "n", v: excelSerial(it[2]), z: "ddd mmm d, yyyy", s: WRAP } : { t: "s", v: it[1], s: WRAP });
    });
    ab["!ref"] = "A1:B" + info.length;
    ab["!cols"] = [{ wch: 16 }, { wch: 100 }];
    X.utils.book_append_sheet(wb, ab, "About");
    return wb;
  }
  function exportXlsx() {
    var btn = $("b-export");
    btn.disabled = true;
    loadXlsx().then(function (X) {
      var out = X.write(buildWorkbook(X), { bookType: "xlsx", type: "array" });
      var filename = slug(state.title) + "_" + todayISO() + ".xlsx";
      if (downloadsApi) {
        return downloadsApi.save({ filename: filename, data: out }).then(function () { flash("Exported " + filename + "."); }, function (err) {
          var code = err && err.code;
          if (code === "declined") return;
          if (code === "rate_limited") flash("A save prompt is already open. Finish it, then try again.");
          else if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") { downloadsApi = null; updateStatus(); flash("Export isn't available in this view."); }
          else flash("Export failed (" + (code || "unknown error") + ").");
        });
      }
      localDownload(filename, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
      flash("Exported " + filename + ".");
    }, function () {
      flash("The Excel library didn't load. Check the internet connection and try again.");
    }).then(function () { btn.disabled = false; });
  }

  /* ---------- events ---------- */
  function wire() {
    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-act]");
      if (!b) return;
      var act = b.dataset.act;
      if (act === "edit-task") openTaskEditor(b.dataset.id);
      else if (act === "add-task") openTaskEditor(null, b.dataset.track);
      else if (act === "edit-track") openTrackEditor(b.dataset.track);
      else if (act === "add-row") {
        var cfg = TABLES.filter(function (c) { return c.key === b.dataset.t; })[0];
        state[cfg.key].push(cfg.blank(state[cfg.key]));
        changed({ tables: true, gantt: cfg.key === "closures" });
        var cells = $("tbl-" + cfg.key).querySelectorAll("tbody tr:last-child .cell, tbody tr:last-child input");
        if (cells[0]) cells[0].focus();
      } else if (act === "del-row") {
        if (!b.classList.contains("armed")) {
          b.classList.add("armed"); b.textContent = "Delete";
          b.addEventListener("blur", function () { b.classList.remove("armed"); b.textContent = "✕"; }, { once: true });
          return;
        }
        var key = b.dataset.t;
        state[key].splice(Number(b.dataset.r), 1);
        changed({ tables: true, gantt: key === "closures" });
      } else if (act === "draft-restore") {
        var d = readDraft();
        if (d && d.data) { state = d.data; $("banner").hidden = true; changed({ header: true, owners: true, legend: true, keyDates: true, gantt: true, tables: true }); flash("Restored your unsaved edits."); }
      } else if (act === "draft-discard") { clearDraft(); $("banner").hidden = true; }
      else if (act === "forget-token") { setToken(""); updateStatus(); flash("Removed your GitHub token from this browser."); }
    });
    document.addEventListener("input", function (e) {
      var el = e.target;
      if (!el.classList || !el.classList.contains("cell")) return;
      var row = state[el.dataset.t] && state[el.dataset.t][Number(el.dataset.r)];
      if (!row) return;
      row[el.dataset.k] = el.innerText.replace(/\n$/, "");
      changed();
    });
    document.addEventListener("change", function (e) {
      var el = e.target;
      if (!el.dataset || !el.dataset.t || el.classList.contains("cell")) return;
      var row = state[el.dataset.t] && state[el.dataset.t][Number(el.dataset.r)];
      if (!row) return;
      row[el.dataset.k] = el.value;
      if (el.tagName === "SELECT") el.className = "tsel chip-" + el.value;
      changed({ gantt: el.dataset.t === "closures" });
    });
    document.addEventListener("focusout", function (e) {
      var el = e.target;
      if (el.classList && el.classList.contains("cell")) {
        var row = state[el.dataset.t] && state[el.dataset.t][Number(el.dataset.r)];
        if (row && typeof row[el.dataset.k] === "string") { var tr = row[el.dataset.k].trim(); if (tr !== row[el.dataset.k]) { row[el.dataset.k] = tr; changed(); } }
      }
    });
    $("b-add-task").addEventListener("click", function () { openTaskEditor(null); });
    $("b-add-track").addEventListener("click", function () { openTrackEditor(); });
    $("b-settings").addEventListener("click", openSettings);
    $("b-save").addEventListener("click", save);
    $("b-export").addEventListener("click", exportXlsx);
    $("sel-owner").addEventListener("change", function (e) { filterOwner = e.target.value; renderGantt(); });
    var g = $("gantt");
    g.addEventListener("pointerdown", onPointerDown);
    g.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    g.addEventListener("pointercancel", onPointerCancel);
    g.addEventListener("keydown", onBarKey);
    g.addEventListener("pointerover", function (e) { if (drag) return; var el = e.target.closest(".bar, .ms"); if (el) { var t = taskById(el.dataset.id); if (t) showTip(el, tipHtml(t)); } });
    g.addEventListener("pointerout", function (e) { if (drag) return; var el = e.target.closest(".bar, .ms"); if (el && !el.contains(e.relatedTarget)) hideTip(); });
    g.addEventListener("focusin", function (e) { var el = e.target.closest(".bar, .ms"); if (el) { var t = taskById(el.dataset.id); if (t) showTip(el, tipHtml(t)); } });
    g.addEventListener("focusout", hideTip);
    $("gantt-scroll").addEventListener("scroll", hideTip, { passive: true });
    window.addEventListener("pagehide", writeDraft);
  }

  function renderAllForMode() {
    renderLegend(); renderGantt(); renderTables(); updateStatus();
  }

  function initCapabilities() {
    var tries = 0;
    if (location.hostname.toLowerCase() === GH.host && !(window.claude && typeof window.claude.use === "function")) { mode = "github"; renderAllForMode(); return; }
    var hasHost = function () { return !!(window.claude && typeof window.claude.use === "function"); };
    var wait = function () {
      if (hasHost()) {
        Promise.all([
          window.claude.use("artifact").catch(function () { return null; }),
          window.claude.use("downloads").catch(function () { return null; })
        ]).then(function (res) {
          artifactApi = res[0]; downloadsApi = res[1];
          mode = artifactApi ? "host" : "readonly";
          renderAllForMode();
        });
        return;
      }
      if (++tries > 10) { mode = "local"; renderAllForMode(); return; }
      setTimeout(wait, 150);
    };
    wait();
  }

  renderShell();
  if (location.hostname.toLowerCase() === GH.host) checkLastSave();
  renderHeader();
  renderOwnerFilter();
  renderLegend();
  renderGantt();
  renderTables();
  updateStatus();
  wire();
  checkDraft();
  initCapabilities();
})();
</script>
</body>
</html>
